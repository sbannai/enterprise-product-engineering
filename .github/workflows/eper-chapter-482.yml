name: EPER Chapter 482
on:
  push:
    paths: ["eper/chapter-482-pilot-v0.1.0/**",".github/workflows/eper-chapter-482.yml"]
  pull_request:
    paths: ["eper/chapter-482-pilot-v0.1.0/**",".github/workflows/eper-chapter-482.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eper/chapter-482-pilot-v0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run requirement tests
        run: |
          set -o pipefail
          node --test 2>&1 | tee ci-test-output.txt
      - name: Capture execution metadata
        run: |
          echo "repository: $GITHUB_REPOSITORY" > execution-metadata.md
          echo "commit: $GITHUB_SHA" >> execution-metadata.md
          echo "run_id: $GITHUB_RUN_ID" >> execution-metadata.md
          echo "node: $(node --version)" >> execution-metadata.md
          echo "timestamp_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> execution-metadata.md
      - uses: actions/upload-artifact@v4
        with:
          name: eper-chapter-482-execution
          path: |
            eper/chapter-482-pilot-v0.1.0/ci-test-output.txt
            eper/chapter-482-pilot-v0.1.0/execution-metadata.md
