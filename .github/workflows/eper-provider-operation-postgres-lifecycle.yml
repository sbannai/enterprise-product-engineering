name: EPER Provider Operation PostgreSQL Lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/eper-provider-operation-postgres-lifecycle.yml"
      - "eper/packages/integrations/**"
      - "eper/packages/audit/**"
      - "eper/scripts/migrate-audit.mjs"
      - "eper/scripts/migrate-payments.mjs"
      - "eper/tests/postgres-provider-operation-lifecycle.integration.test.mjs"
      - "eper/tests/postgres-encrypted-provider-payload-store.integration.test.mjs"
      - "eper/tests/postgres-customer-asset-repository.integration.test.mjs"
      - "eper/tests/customer-asset-repository-migration.test.mjs"
      - "eper/tests/provider-operation-worker.test.mjs"
      - "eper/tests/provider-operation-worker-host.test.mjs"
      - "eper/tests/postgres-provider-queue-wake-source.test.mjs"
      - "eper/tests/postgres-provider-queue-wake-source.integration.test.mjs"
      - "eper/tests/provider-payload-keyring.test.mjs"
      - "eper/package.json"
      - "eper/package-lock.json"
      - "eper/tsconfig.json"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/eper-provider-operation-postgres-lifecycle.yml"
      - "eper/packages/integrations/**"
      - "eper/packages/audit/**"
      - "eper/scripts/migrate-audit.mjs"
      - "eper/scripts/migrate-payments.mjs"
      - "eper/tests/postgres-provider-operation-lifecycle.integration.test.mjs"
      - "eper/tests/postgres-encrypted-provider-payload-store.integration.test.mjs"
      - "eper/tests/provider-operation-worker.test.mjs"
      - "eper/tests/provider-operation-worker-host.test.mjs"
      - "eper/tests/postgres-provider-queue-wake-source.test.mjs"
      - "eper/tests/postgres-provider-queue-wake-source.integration.test.mjs"
      - "eper/tests/provider-payload-keyring.test.mjs"
      - "eper/package.json"
      - "eper/package-lock.json"
      - "eper/tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-operation-postgres-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eper
          POSTGRES_PASSWORD: eper_test_password
          POSTGRES_DB: eper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eper -d eper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eper:eper_test_password@localhost:5432/eper_test
    defaults:
      run:
        working-directory: eper
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Apply payment foundation
        run: npm run migrate:payments
      - name: Apply provider and audit migrations, including payload references and leases
        run: npm run migrate:audit
      - name: Verify customer asset migration contract and PostgreSQL repository lifecycle
        run: |
          node --test tests/customer-asset-repository-migration.test.mjs
          node --test tests/postgres-customer-asset-repository.integration.test.mjs
      - name: Exercise durable provider-operation concurrency, fencing and recovery
        run: node --test tests/postgres-provider-operation-lifecycle.integration.test.mjs
      - name: Exercise bounded provider worker authorization, routing and outcome handling
        run: node --test tests/provider-operation-worker.test.mjs
      - name: Exercise event-driven provider worker host lifecycle
        run: node --test tests/provider-operation-worker-host.test.mjs
      - name: Exercise PostgreSQL queue notification listener and reconnect
        run: node --test tests/postgres-provider-queue-wake-source.test.mjs
      - name: Verify PostgreSQL NOTIFY delivery occurs after transaction commit
        run: node --test tests/postgres-provider-queue-wake-source.integration.test.mjs
      - name: Exercise legacy v1 compatibility and v2 keyring rotation
        run: node --test tests/provider-payload-keyring.test.mjs
      - name: Exercise encrypted payload PostgreSQL scope and lifecycle metadata
        run: node --test tests/postgres-encrypted-provider-payload-store.integration.test.mjs
