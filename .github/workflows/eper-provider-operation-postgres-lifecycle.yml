name: EPER Provider Operation PostgreSQL Lifecycle

on:
  pull_request:
    paths:
      - ".github/workflows/eper-provider-operation-postgres-lifecycle.yml"
      - "eper/packages/integrations/**"
      - "eper/packages/audit/**"
      - "eper/scripts/migrate-audit.mjs"
      - "eper/scripts/migrate-payments.mjs"
      - "eper/tests/postgres-provider-operation-lifecycle.integration.test.mjs"
      - "eper/tests/postgres-customer-asset-runtime-rls.integration.test.mjs"
      - "eper/tests/postgres-customer-asset-migration-replay.integration.test.mjs"
      - "eper/package.json"
      - "eper/package-lock.json"
      - "eper/tsconfig.json"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/eper-provider-operation-postgres-lifecycle.yml"
      - "eper/packages/integrations/**"
      - "eper/packages/audit/**"
      - "eper/scripts/migrate-audit.mjs"
      - "eper/scripts/migrate-payments.mjs"
      - "eper/tests/postgres-provider-operation-lifecycle.integration.test.mjs"
      - "eper/tests/postgres-customer-asset-runtime-rls.integration.test.mjs"
      - "eper/package.json"
      - "eper/package-lock.json"
      - "eper/tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-operation-postgres-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eper
          POSTGRES_PASSWORD: eper_test_password
          POSTGRES_DB: eper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eper -d eper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eper:eper_test_password@localhost:5432/eper_test
    defaults:
      run:
        working-directory: eper
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Apply payment foundation
        run: npm run migrate:payments
      - name: Apply provider and audit migrations, including payload references and leases
        run: npm run migrate:audit
      - name: Prove customer asset migration 021 is replay-safe on PostgreSQL 16
        run: node --test tests/postgres-customer-asset-migration-replay.integration.test.mjs
      - name: Prove customer asset tenant and application isolation under runtime role
        run: node --test tests/postgres-customer-asset-runtime-rls.integration.test.mjs
      - name: Exercise durable provider-operation concurrency, fencing and recovery
        run: node --test tests/postgres-provider-operation-lifecycle.integration.test.mjs
