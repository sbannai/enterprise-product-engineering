# Re-run controlled QA after payment/receipt branch reconciliation.
name: EPER RE-EXEC-001 Controlled QA Re-Execution

# Isolate each PR validation by its exact head commit. Push and manual runs
# are isolated by the exact commit being tested, never merely by branch name.
concurrency:
  group: eper-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "eper/**"
      - ".github/workflows/eper-reexec-qa.yml"
  push:
    branches: ["main"]
    paths:
      - "eper/**"
  workflow_dispatch:

jobs:
  controlled-qa-reexecution:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: eper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build candidate
        run: npm run build
      - name: Initialize QA evidence
        if: always()
        run: |
          mkdir -p reexec-evidence
          : > reexec-evidence/qa-progress.jsonl
          : > reexec-evidence/qa-test-output.log
      - name: Execute bounded full regression test suite
        run: |
          set +e
          set -o pipefail
          test_started_epoch=$(date +%s)
          test_started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          timeout --signal=TERM --kill-after=60s 60m node --test \
            --test-reporter=tap \
            --test-reporter=./scripts/qa-progress-reporter.mjs \
            --test-reporter-destination=stdout \
            --test-reporter-destination=reexec-evidence/qa-progress.jsonl \
            tests/*.test.mjs 2>&1 | tee reexec-evidence/qa-test-output.log
          test_status=${PIPESTATUS[0]}
          test_ended_epoch=$(date +%s)
          test_ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "test_started_at=$test_started_at"
            echo "test_ended_at=$test_ended_at"
            echo "test_duration_seconds=$((test_ended_epoch - test_started_epoch))"
            echo "test_exit_code=$test_status"
            if [ "$test_status" -eq 124 ]; then echo "test_timeout=60m"; else echo "test_timeout=not_reached"; fi
          } > reexec-evidence/test-timing.txt
          exit "$test_status"
      - name: Record execution metadata
        if: always()
        run: |
          mkdir -p reexec-evidence
          {
            echo "program=EPER-REEXEC-001"
            echo "classification=NEW CONTROLLED EXECUTION EVIDENCE — NOT HISTORICAL EVIDENCE"
            echo "population=full EPER Node.js regression test suite; 228-requirement pilot matrix is a separate workflow check"
            echo "commit=${{github.sha}}"
            echo "run_id=${{github.run_id}}"
            echo "run_number=${{github.run_number}}"
            echo "workflow=${{github.workflow}}"
            echo "repository=${{github.repository}}"
            echo "runner_os=$RUNNER_OS"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > reexec-evidence/execution-metadata.txt
      - name: Write run-specific QA evidence summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from "node:fs";

          const logPath = "reexec-evidence/qa-test-output.log";
          const log = existsSync(logPath) ? readFileSync(logPath, "utf8") : "";
          const summary = {};
          for (const key of ["tests", "pass", "fail", "cancelled", "skipped"]) {
            const match = [...log.matchAll(new RegExp(`^# ${key} (\\d+)$`, "gm"))].at(-1);
            summary[key] = match ? Number(match[1]) : null;
          }

          let event = {};
          try {
            event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          } catch {
            // Push and workflow_dispatch runs do not have pull_request metadata.
          }
          const prHeadSha = event.pull_request?.head?.sha ?? process.env.GITHUB_SHA;
          const prMergeSha = event.pull_request?.merge_commit_sha ?? process.env.GITHUB_SHA;
          const summaryComplete =
            ["tests", "pass", "fail", "cancelled", "skipped"].every((key) => summary[key] !== null) &&
            summary.tests > 0;
          const outcome = !summaryComplete ? "INCOMPLETE" :
            summary.fail > 0 ? "FAIL" :
            summary.cancelled > 0 ? "INCOMPLETE" : "PASS";

          const lines = [
            `# EPER-REEXEC-001 — Controlled QA Re-Execution Run ${process.env.GITHUB_RUN_NUMBER}`,
            "",
            "Classification: NEW CONTROLLED EXECUTION EVIDENCE — NOT HISTORICAL EVIDENCE",
            "",
            "- Population: full EPER Node.js regression test suite (separate from the 228-requirement pilot matrix)",
            `- Workflow run ID: ${process.env.GITHUB_RUN_ID}`,
            `- Repository: ${process.env.GITHUB_REPOSITORY}`,
            `- PR head SHA: ${prHeadSha}`,
            `- PR merge/check-out SHA: ${prMergeSha}`,
            `- GitHub checkout SHA: ${process.env.GITHUB_SHA}`,
            `- Test subtests: ${summary.tests ?? "UNAVAILABLE"}`,
            `- Passed: ${summary.pass ?? "UNAVAILABLE"}`,
            `- Failed: ${summary.fail ?? "UNAVAILABLE"}`,
            `- Cancelled: ${summary.cancelled ?? "UNAVAILABLE"}`,
            `- Skipped: ${summary.skipped ?? "UNAVAILABLE"}`,
            `- Technical QA outcome: ${outcome}`,
            "- Full TAP output: qa-test-output.log",
            "- Per-test execution event timeline: qa-progress.jsonl",
            "- Test timing and timeout status: test-timing.txt",
            "- Execution metadata: execution-metadata.txt",
            "",
            "## Interpretation",
            "",
            "This report is generated from the current workflow run and its test log. It does not establish business UAT, release/go-live, production/operations, final acceptance, certification, or traceability freeze.",
            "",
            "A PASS is recorded only when a complete TAP summary exists, failed tests are zero, and cancelled tests are zero. Missing or incomplete summaries remain INCOMPLETE. The regression suite is bounded to 60 minutes; a timeout is a failed/incomplete execution, not a pass.",
            ""
          ];
          writeFileSync(`reexec-evidence/EPER-REEXEC-001-${process.env.GITHUB_RUN_ID}.md`, lines.join("\n"));
          NODE
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EPER-REEXEC-001-${{github.run_id}}
          path: eper/reexec-evidence/
          if-no-files-found: error
