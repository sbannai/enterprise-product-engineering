name: EPER CI

# Focused CI lane: schema/migration safety, capability conformance, and UAT preflight.
# Full-suite and same-commit end-to-end validation live in eper-integrated-validation.yml.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "eper/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "reconcile/payment-153-168-integration"]
    paths:
      - "eper/**"
      - ".github/workflows/ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eper
          POSTGRES_PASSWORD: eper_ci_password
          POSTGRES_DB: eper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eper -d eper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://eper:eper_ci_password@localhost:5432/eper_test
      EPER_CAMPAIGN_SCHEDULER_TEST_DATABASE_URL: postgres://eper:eper_ci_password@localhost:5432/eper_test
    defaults:
      run:
        working-directory: eper
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Workflow rules, capability composition and tariff entitlement unit regressions
        run: node --test tests/workflow-rule-engine.test.mjs tests/capability-composition.test.mjs tests/postgres-module-entitlement-service.test.mjs
      - name: Customer asset upload recovery and provider binding regressions
        run: node --test tests/customer-asset-upload-recovery-service.test.mjs tests/customer-asset-upload-authorization.test.mjs tests/customer-asset-upload-request-authorization.test.mjs tests/customer-asset-upload-readiness.test.mjs tests/customer-asset-upload-api.test.mjs tests/storage-upload-adapter.test.mjs tests/customer-asset-repository-migration.test.mjs
      - name: Apply payment schema migrations to ephemeral CI database
        run: npm run migrate:payments
      - name: Apply audit and admin-configuration migrations to ephemeral CI database
        run: npm run migrate:audit
      - name: Verify customer asset migrations replay on PostgreSQL 16 with RLS and data intact
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/audit/migrations/021_customer_asset_repository.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('eper.tenant_id', 'ci-asset-replay', false);
          SELECT set_config('eper.application_id', 'ci-asset-replay-app', false);
          INSERT INTO eper_customer_assets (
            tenant_id, asset_id, repository_scope, owner_application_id,
            display_name, original_file_name, media_category, mime_type,
            file_extension, size_bytes, storage_adapter_key, storage_object_reference,
            created_by, updated_by
          ) VALUES (
            'ci-asset-replay', '00000000-0000-4000-8000-000000000021',
            'application_restricted', 'ci-asset-replay-app',
            'Replay sentinel', 'sentinel.txt', 'document', 'text/plain',
            'txt', 12, 'ci-test', 'opaque:ci-replay-sentinel', 'ci', 'ci'
          );
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/audit/migrations/021_customer_asset_repository.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/audit/migrations/022_customer_asset_scan_dispatch.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/audit/migrations/022_customer_asset_scan_dispatch.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/audit/migrations/023_customer_asset_upload_recovery.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/audit/migrations/023_customer_asset_upload_recovery.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('eper.tenant_id', 'ci-asset-replay', false);
          SELECT set_config('eper.application_id', 'ci-asset-replay-app', false);
          DO $verify$
          DECLARE table_name text;
          BEGIN
            FOREACH table_name IN ARRAY ARRAY['eper_customer_assets','eper_customer_asset_application_links','eper_customer_asset_upload_sessions','eper_customer_asset_scan_jobs'] LOOP
              IF NOT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname=table_name AND c.relrowsecurity AND c.relforcerowsecurity) THEN
                RAISE EXCEPTION 'customer asset table missing ENABLE/FORCE RLS: %', table_name;
              END IF;
            END LOOP;
            IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='eper_customer_assets' AND policyname='customer_asset_application_read')
              OR NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='eper_customer_assets' AND policyname='customer_asset_application_insert')
              OR NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='eper_customer_assets' AND policyname='customer_asset_application_update')
              OR NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='eper_customer_asset_application_links' AND policyname='customer_asset_application_link_isolation')
              OR NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='eper_customer_asset_upload_sessions' AND policyname='customer_asset_upload_session_isolation')
              OR NOT EXISTS (SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename='eper_customer_asset_scan_jobs' AND policyname='customer_asset_scan_job_application_isolation') THEN
              RAISE EXCEPTION 'customer asset RLS policies missing after replay';
            END IF;
            IF NOT has_table_privilege('eper_customer_asset_access','public.eper_customer_assets','SELECT')
              OR NOT has_table_privilege('eper_customer_asset_access','public.eper_customer_assets','INSERT')
              OR NOT has_table_privilege('eper_customer_asset_access','public.eper_customer_assets','UPDATE')
              OR has_table_privilege('eper_customer_asset_access','public.eper_customer_assets','DELETE')
              OR NOT has_table_privilege('eper_customer_asset_access','public.eper_customer_asset_upload_sessions','INSERT')
              OR NOT has_table_privilege('eper_customer_asset_access','public.eper_customer_asset_scan_jobs','UPDATE') THEN
              RAISE EXCEPTION 'customer asset least-privilege grants missing or DELETE unexpectedly granted';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM eper_customer_assets WHERE tenant_id='ci-asset-replay' AND asset_id='00000000-0000-4000-8000-000000000021' AND display_name='Replay sentinel') THEN
              RAISE EXCEPTION 'customer asset data was not preserved across migration replay';
            END IF;
          END
          $verify$;
          SQL
      - name: Live PostgreSQL customer asset upload recovery integration
        env:
          EPER_CUSTOMER_ASSET_LIVE_TESTS: "1"
        run: node --test tests/postgres-customer-asset-upload-recovery.integration.test.mjs
      - name: Apply workflow execution, publication and role migrations to ephemeral CI database
        run: npm run migrate:workflows
      - name: Verify workflow migrations are safely repeatable
        run: npm run migrate:workflows
      - name: Provision isolated restricted workflow outbox login for privilege proof
        shell: bash
        run: |
          set -euo pipefail
          worker_password="$(openssl rand -hex 32)"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE eper_workflow_outbox_worker_test WITH LOGIN PASSWORD '${worker_password}' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT CONNECT ON DATABASE eper_test TO eper_workflow_outbox_worker_test"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT eper_workflow_outbox_worker_access TO eper_workflow_outbox_worker_test"
          echo "EPER_WORKFLOW_OUTBOX_TEST_DATABASE_URL=postgres://eper_workflow_outbox_worker_test:${worker_password}@localhost:5432/eper_test" >> "$GITHUB_ENV"
          echo "EPER_WORKFLOW_OUTBOX_EXPECTED_DATABASE_ROLE=eper_workflow_outbox_worker_test" >> "$GITHUB_ENV"
      - name: Verify dedicated workflow outbox login privileges on PostgreSQL 16
        run: node --test tests/workflow-outbox-worker-access.integration.test.mjs
      - name: Verify worker startup privilege gate with dedicated PostgreSQL 16 login
        run: node --test tests/workflow-outbox-worker-database.integration.test.mjs
      - name: Prove PostgreSQL claim-generation fencing against stale worker acknowledgements
        run: node --test tests/workflow-outbox-claim-generation.integration.test.mjs
      - name: Verify worker configuration, claim fencing, store and approval dispatcher contracts
        run: node --test tests/workflow-outbox-claim-generation-migration.test.mjs tests/workflow-outbox-worker-access-migration.test.mjs tests/workflow-outbox-store.test.mjs tests/workflow-outbox-worker-config.test.mjs tests/workflow-outbox-dispatcher-adapter.test.mjs tests/workflow-outbox-worker.test.mjs tests/workflow-outbox-dispatcher-module.test.mjs tests/workflow-outbox-worker-main.test.mjs
      - name: Live PostgreSQL workflow execution integration
        run: node --test tests/postgres-workflow-execution.integration.test.mjs
      - name: Live PostgreSQL tenant and actor application assignment integration
        env:
          EPER_IDENTITY_ASSIGNMENT_LIVE_TESTS: "1"
        run: node --test tests/postgres-application-assignment-live.integration.test.mjs
      - name: Live PostgreSQL commercial tariff access guard integration
        run: node --test tests/postgres-module-entitlement-commercial-guard.integration.test.mjs
      - name: Apply campaign scheduler migrations to ephemeral CI database
        run: npm run migrate:campaign-scheduler
      - name: Apply capability persistence migrations to ephemeral CI database
        run: npm run migrate:capabilities
      - name: Apply ticketing persistence migrations to ephemeral CI database
        run: npm run migrate:ticketing
      - name: Verify ticketing migrations are safely repeatable
        run: npm run migrate:ticketing
      - name: Verify capability migrations are safely repeatable
        run: npm run migrate:capabilities
      # The same-commit integrated-validation workflow owns the full EPER
      # suite and payment/receipt contracts. Keep capability-specific live
      # PostgreSQL conformance here because it is unique to this CI lane.
      - name: Initialize CI diagnostic evidence
        if: always()
        run: mkdir -p reexec-evidence/ci-logs
      - name: Live PostgreSQL capability conformance (RLS, audit immutability, rollback)
        env:
          EPER_CAPABILITY_LIVE_TESTS: "1"
        run: |
          set -o pipefail
          node --test tests/postgres-capability-live.integration.test.mjs 2>&1 | tee reexec-evidence/ci-logs/postgres-capability-live.log
      - name: UAT preflight regression tests
        run: |
          set -o pipefail
          python3 -m unittest discover -s uat/tests -p 'test_*.py' -v 2>&1 | tee reexec-evidence/ci-logs/uat-preflight.log
      - name: Read-only business UAT readiness audit
        run: |
          python3 uat/scripts/b01_readiness_audit.py > /tmp/b01-readiness.json
          python3 -c "import json; d=json.load(open('/tmp/b01-readiness.json')); print(json.dumps({'readiness': d['readiness'], 'counts': d['counts'], 'blockers': [{'gate': b['gate'], 'count': b['count']} for b in d['blockers']], 'integrityErrors': d['integrityErrors']}, indent=2))"

      - name: Upload CI diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EPER-CI-DIAGNOSTICS-${{ github.run_id }}
          path: eper/reexec-evidence/ci-logs/
          if-no-files-found: warn
          retention-days: 14
