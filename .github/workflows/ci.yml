name: EPER CI

# Final verification: run the complete EPER gate on pull requests.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "reconcile/payment-153-168-integration"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eper
          POSTGRES_PASSWORD: eper_ci_password
          POSTGRES_DB: eper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eper -d eper_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://eper:eper_ci_password@localhost:5432/eper_test
    defaults:
      run:
        working-directory: eper
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Apply payment schema migrations to ephemeral CI database
        run: npm run migrate:payments
      - name: Apply audit and admin-configuration migrations to ephemeral CI database
        run: npm run migrate:audit
      - name: Test
        run: npm test
      - name: Payment gateway contract tests
        run: node --test tests/payment-gateway.test.mjs
      - name: Trusted invoice amount authority tests
        run: node --test tests/invoice-amount-authority.test.mjs
      - name: PostgreSQL payment-store integration tests
        run: node --test tests/postgres-payment-store.test.mjs tests/postgres-payment-runtime.test.mjs tests/postgres-payment-api-route.test.mjs tests/postgres-payment-store.integration.test.mjs
      - name: Generic transaction and receipt contract tests
        run: node --test tests/transaction-receipt-contract.test.mjs
      - name: UAT preflight regression tests
        run: python3 -m unittest discover -s uat/tests -p 'test_*.py' -v
      - name: Read-only business UAT readiness audit
        run: |
          python3 uat/scripts/b01_readiness_audit.py > /tmp/b01-readiness.json
          python3 -c "import json; d=json.load(open('/tmp/b01-readiness.json')); print(json.dumps({'readiness': d['readiness'], 'counts': d['counts'], 'blockers': [{'gate': b['gate'], 'count': b['count']} for b in d['blockers']], 'integrityErrors': d['integrityErrors']}, indent=2))"
