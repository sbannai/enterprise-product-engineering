name: EPER Chapter 480
on:
  push:
    paths: ["eper/chapter-480-pilot-v0.1.0/**",".github/workflows/eper-chapter-480.yml"]
  pull_request:
    paths: ["eper/chapter-480-pilot-v0.1.0/**",".github/workflows/eper-chapter-480.yml"]
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eper/chapter-480-pilot-v0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Run requirement tests
        run: |
          set -o pipefail
          node --test 2>&1 | tee ci-test-output.txt
      - name: Capture execution metadata
        run: |
          {
            echo "# Chapter 480 CI Execution Metadata"
            echo "repository: $GITHUB_REPOSITORY"
            echo "commit: $GITHUB_SHA"
            echo "workflow: $GITHUB_WORKFLOW"
            echo "run_id: $GITHUB_RUN_ID"
            echo "run_number: $GITHUB_RUN_NUMBER"
            echo "event: $GITHUB_EVENT_NAME"
            echo "ref: $GITHUB_REF"
            echo "node: $(node --version)"
            echo "timestamp_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > execution-metadata.md
      - name: Upload execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: eper-chapter-480-execution
          path: |
            eper/chapter-480-pilot-v0.1.0/ci-test-output.txt
            eper/chapter-480-pilot-v0.1.0/execution-metadata.md
