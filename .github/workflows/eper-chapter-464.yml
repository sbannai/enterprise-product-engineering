name: EPER Chapter 464

on:
  push:
    paths:
      - "eper/chapter-464-pilot-v0.1.0/**"
      - ".github/workflows/eper-chapter-464.yml"
  pull_request:
    paths:
      - "eper/chapter-464-pilot-v0.1.0/**"
      - ".github/workflows/eper-chapter-464.yml"

jobs:
  chapter-464-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eper/chapter-464-pilot-v0.1.0
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify runtime
        run: node --version

      - name: Run Chapter 464 tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee ci-test-output.txt

      - name: Generate execution metadata
        run: |
          {
            echo "## EPER Chapter 464 Execution"
            echo ""
            echo "- Runtime: Node.js 20"
            echo "- Working directory: eper/chapter-464-pilot-v0.1.0"
            echo "- Commit: $GITHUB_SHA"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Executed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > execution-metadata.md

      - name: Upload execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: eper-chapter-464-execution
          path: |
            eper/chapter-464-pilot-v0.1.0/ci-test-output.txt
            eper/chapter-464-pilot-v0.1.0/execution-metadata.md
