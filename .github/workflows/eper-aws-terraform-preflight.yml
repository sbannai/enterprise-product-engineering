name: EPER AWS Terraform Preflight

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - "eper/infra/aws/terraform/**"
      - ".github/workflows/eper-aws-terraform-preflight.yml"
  workflow_dispatch:

jobs:
  terraform-preflight:
    name: Validate Terraform without provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Check formatting
        working-directory: eper/infra/aws/terraform
        run: terraform fmt -check -diff -recursive

      - name: Initialize without backend
        working-directory: eper/infra/aws/terraform
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: eper/infra/aws/terraform
        run: terraform validate -no-color

      - name: Verify UAT security invariants
        shell: bash
        run: |
          set -euo pipefail
          main="eper/infra/aws/terraform/main.tf"
          vars="eper/infra/aws/terraform/variables.tf"
          grep -Fq 'image_tag_mutability = "IMMUTABLE"' "$main"
          grep -Fq 'assign_public_ip = false' "$main"
          grep -Fq 'condition     = var.image_tag == var.build_id' "$main"
          grep -Fq 'data "aws_vpc" "selected"' "$main"
          grep -Fq 'id = var.vpc_id' "$main"
          grep -Fq 'variable "vpc_id"' "$vars"
          grep -Fq 'length(var.alb_subnet_ids) >= 2' "$vars"
          grep -Fq 'cidr != "0.0.0.0/0"' "$vars"
          ! grep -Fq 'default = true' "$main"
          echo "Security invariants present: immutable image tags, private tasks, matching build identity, explicit VPC, multi-subnet ALB, no unrestricted ingress or default-VPC assumption."

      - name: Verify deployment remains gated
        shell: bash
        run: |
          set -euo pipefail
          test -f eper/infra/aws/terraform/main.tf
          test -f eper/infra/aws/terraform/variables.tf
          ! grep -RInE '(^|[[:space:]])(apply|destroy)[[:space:]]' .github/workflows/eper-aws-terraform-preflight.yml
          echo "Preflight only: no plan, apply, AWS credentials, or provisioning performed."
