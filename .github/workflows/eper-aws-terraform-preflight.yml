name: EPER AWS Terraform Preflight

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - "eper/infra/aws/terraform/**"
      - ".github/workflows/eper-aws-terraform-preflight.yml"
  workflow_dispatch:

jobs:
  terraform-preflight:
    name: Validate Terraform without provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: Check formatting
        working-directory: eper/infra/aws/terraform
        run: terraform fmt -check -diff -recursive

      - name: Initialize without backend
        working-directory: eper/infra/aws/terraform
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        working-directory: eper/infra/aws/terraform
        run: terraform validate -no-color

      - name: Verify deployment remains gated
        shell: bash
        run: |
          set -euo pipefail
          test -f eper/infra/aws/terraform/main.tf
          test -f eper/infra/aws/terraform/variables.tf
          ! grep -RInE '(^|[[:space:]])(apply|destroy)[[:space:]]' .github/workflows/eper-aws-terraform-preflight.yml
          echo "Preflight only: no plan, apply, AWS credentials, or provisioning performed."
