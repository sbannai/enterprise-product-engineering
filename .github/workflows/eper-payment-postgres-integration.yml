# Re-run this gate on the reconciled payment/receipt branch before integration sign-off.
name: EPER PostgreSQL payment-store integration

# Keep this gate enabled on both payment persistence and generic receipt-contract branches.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ["fix/payment-production-persistence-guard", "feat/generic-transaction-receipt-contract", "reconcile/payment-153-168-integration", "reconcile/payment-stack-with-receipt-contract"]
  pull_request:
    paths:
      - "eper/packages/payments/**"
      - "eper/packages/pricing/**"
      - "eper/apps/api/main.ts"
      - "eper/apps/api/server.ts"
      - "eper/apps/api/payments.ts"
      - "eper/Dockerfile"
      - "eper/scripts/migrate-payments.mjs"
      - "eper/tests/postgres-payment-store.integration.test.mjs"
      - "eper/tests/postgres-payment-store.test.mjs"
      - "eper/tests/postgres-payment-api-route.test.mjs"
      - "eper/tests/postgres-legacy-order-snapshot-gate.test.mjs"
      - "eper/tests/postgres-payment-runtime.test.mjs"
      - "eper/tests/payment-production-guard.test.mjs"
      - "eper/tests/payment-gateway.test.mjs"
      - "eper/tests/payment-readiness.test.mjs"
      - "eper/tests/invoice-amount-authority.test.mjs"
      - "eper/tests/http-invoice-amount-source.test.mjs"
      - "eper/tests/http-transaction-snapshot-source.test.mjs"
      - "eper/tests/transaction-receipt-contract.test.mjs"
      - "eper/package.json"
      - "eper/package-lock.json"
      - "eper/tsconfig.json"
  workflow_dispatch:

jobs:
  postgres-payment-store:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eper
          POSTGRES_PASSWORD: eper_test_password
          POSTGRES_DB: eper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eper -d eper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eper:eper_test_password@localhost:5432/eper_test
    defaults:
      run:
        working-directory: eper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Test market price-book contract
        run: |
          set -o pipefail
          node --test tests/market-price-book.test.mjs 2>&1 | tee reexec-evidence/ci-logs/market-price-book.log
      - name: Test PostgreSQL runtime pool configuration
        run: |
          set -o pipefail
          node --test tests/postgres-payment-runtime.test.mjs 2>&1 | tee reexec-evidence/ci-logs/postgres-payment-runtime.log
      - name: Test PostgreSQL-backed payment and receipt API flow
        run: |
          set -o pipefail
          node --test tests/postgres-payment-api-route.test.mjs 2>&1 | tee reexec-evidence/ci-logs/postgres-payment-api-route.log
      - name: Test legacy orders without immutable transaction snapshots fail closed
        run: |
          set -o pipefail
          node --test tests/postgres-legacy-order-snapshot-gate.test.mjs 2>&1 | tee reexec-evidence/ci-logs/postgres-legacy-order-snapshot-gate.log
      - name: Test payment-store validation and transaction rollback cases
        run: |
          set -o pipefail
          node --test tests/postgres-payment-store.test.mjs 2>&1 | tee reexec-evidence/ci-logs/postgres-payment-store.log
      - name: Test production payment routes remain fail-closed
        run: |
          set -o pipefail
          node --test tests/payment-production-guard.test.mjs 2>&1 | tee reexec-evidence/ci-logs/payment-production-guard.log
      - name: Test payment readiness blockers and production review gate
        run: |
          set -o pipefail
          node --test tests/payment-readiness.test.mjs 2>&1 | tee reexec-evidence/ci-logs/payment-readiness.log
      - name: Test gateway signature and receipt safety regressions
        run: |
          set -o pipefail
          node --test tests/payment-gateway.test.mjs 2>&1 | tee reexec-evidence/ci-logs/payment-gateway.log
      - name: Test trusted invoice amount authority contract
        run: |
          set -o pipefail
          node --test tests/invoice-amount-authority.test.mjs 2>&1 | tee reexec-evidence/ci-logs/invoice-amount-authority.log
      - name: Test HTTP invoice authority response validation
        run: |
          set -o pipefail
          node --test tests/http-invoice-amount-source.test.mjs 2>&1 | tee reexec-evidence/ci-logs/http-invoice-amount-source.log
      - name: Test generic transaction and receipt contract
        run: |
          set -o pipefail
          node --test tests/transaction-receipt-contract.test.mjs 2>&1 | tee reexec-evidence/ci-logs/transaction-receipt-contract.log
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply all payment migrations through the deployment runner
        run: npm run migrate:payments
      - name: Exercise real PostgreSQL transactions and constraints
        run: node --test tests/postgres-payment-store.integration.test.mjs

      - name: Upload payment diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EPER-PAYMENT-POSTGRES-DIAGNOSTICS-${{ github.run_id }}
          path: eper/reexec-evidence/ci-logs/
          if-no-files-found: warn
          retention-days: 14
