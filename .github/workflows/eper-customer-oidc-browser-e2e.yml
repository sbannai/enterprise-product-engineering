# Uses a deterministic local OIDC test issuer and disposable PostgreSQL. This verifies the browser protocol/session lifecycle, not production identity-provider interoperability.
# The main-push run is evidence only for its own head_sha; prior-head green browser runs are historical.
name: EPER Customer OIDC Browser E2E

on:
  # This check is a repository-required status context, so it must emit on every PR.
  # Path-filtering pull_request would leave the required context permanently pending
  # for unrelated PRs. Keep narrower path filters only for main pushes.
  pull_request:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - "eper/apps/api/**"
      - "eper/packages/identity/**"
      - "eper/tests/customer-portal-preview.test.mjs"
      - "eper/tests/customer-oidc-*.mjs"
      - "eper/tests/customer-browser-*.mjs"
      - "eper/tests/postgres-customer-asset-upload-recovery.integration.test.mjs"
      - "eper/tests/platform-application-remediation.browser.e2e.mjs"
      - "eper/tests/postgres-module-entitlement-commercial-guard.integration.test.mjs"
      - "eper/packages/assets/**"
      - "eper/packages/integrations/synthetic-provider-storage-*.ts"
      - "eper/tests/customer-asset-*.mjs"
      - "eper/tests/postgres-customer-asset-*.integration.test.mjs"
      - "eper/tests/storage-*.test.mjs"
      - "eper/tests/synthetic-provider-storage-*.mjs"
      - ".github/workflows/eper-customer-oidc-browser-e2e.yml"

permissions:
  contents: read

jobs:
  browser-lifecycle:
    name: Chromium OIDC login, protected access, logout and revocation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eper
          POSTGRES_PASSWORD: eper_local_only_password
          POSTGRES_DB: eper_test_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eper -d eper_test_local"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://eper:eper_local_only_password@127.0.0.1:5432/eper_test_local
    defaults:
      run:
        working-directory: eper
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install locked application dependencies
        run: npm ci
      - name: Install pinned ephemeral browser-test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run fresh-clone PostgreSQL migrations and integration verification
        run: npm run dev:verify
      - name: Run real-browser customer OIDC lifecycle
        run: node --test tests/customer-oidc-browser.e2e.mjs
      - name: Run real-browser Product Admin application remediation
        run: node --test tests/platform-application-remediation.browser.e2e.mjs
