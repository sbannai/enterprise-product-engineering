name: EPER Customer OIDC Browser E2E

on:
  pull_request:
    branches: ["main"]
    paths:
      - "eper/apps/api/**"
      - "eper/packages/identity/**"
      - "eper/tests/customer-oidc-*.mjs"
      - "eper/tests/customer-browser-*.mjs"
      - ".github/workflows/eper-customer-oidc-browser-e2e.yml"
  push:
    branches: ["main"]
    paths:
      - "eper/apps/api/**"
      - "eper/packages/identity/**"
      - "eper/tests/customer-oidc-*.mjs"
      - "eper/tests/customer-browser-*.mjs"
      - ".github/workflows/eper-customer-oidc-browser-e2e.yml"

permissions:
  contents: read

jobs:
  browser-lifecycle:
    name: Chromium OIDC login, protected access, logout and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eper
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install locked application dependencies
        run: npm ci
      - name: Install pinned ephemeral browser-test runner
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build EPER
        run: npm run build
      - name: Run real-browser customer OIDC lifecycle
        run: node --test tests/customer-oidc-browser.e2e.mjs
