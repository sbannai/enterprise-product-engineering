name: EPER Read-only Requirement Registry API

on:
  pull_request:
    paths:
      - "eper/apps/api/server.ts"
      - "eper/packages/requirements/registry.ts"
      - "eper/tests/requirements-api.test.mjs"
      - "eper/contracts/api/**"
      - "eper/package.json"
      - "eper/package-lock.json"
      - "eper/tsconfig.json"
      - ".github/workflows/eper-requirements-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  requirements-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eper
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and run regression suite
        run: npm test
