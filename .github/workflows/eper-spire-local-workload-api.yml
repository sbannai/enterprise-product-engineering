name: EPER SPIRE local Workload API attestation

on:
  push:
    branches:
      - test/459-local-scanner-child-composition
    paths:
      - "eper/tests/fixtures/spire-workload-api/**"
      - "eper/packages/assets/customer-asset-scan-child-spiffe-identity.ts"
      - "eper/packages/assets/customer-asset-scan-child-spiffe-sdk-adapter.ts"
      - "eper/packages/assets/customer-asset-scan-child-database-credential-issuer.ts"
      - "eper/tests/customer-asset-scan-child-spiffe-*.test.mjs"
      - "eper/tests/customer-asset-scan-child-database-credential-issuer*.test.mjs"
      - ".github/workflows/eper-spire-local-workload-api.yml"
  pull_request:
    paths:
      - "eper/tests/fixtures/spire-workload-api/**"
      - "eper/packages/assets/customer-asset-scan-child-spiffe-identity.ts"
      - "eper/packages/assets/customer-asset-scan-child-spiffe-sdk-adapter.ts"
      - "eper/packages/assets/customer-asset-scan-child-database-credential-issuer.ts"
      - "eper/tests/customer-asset-scan-child-spiffe-*.test.mjs"
      - "eper/tests/customer-asset-scan-child-database-credential-issuer*.test.mjs"
      - ".github/workflows/eper-spire-local-workload-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install locked dependencies
        working-directory: eper
        run: npm ci
      - name: Build and run scanner identity and credential issuer contracts
        working-directory: eper
        run: npm run build && node --test tests/customer-asset-scan-child-spiffe-identity.test.mjs tests/customer-asset-scan-child-spiffe-sdk-adapter.test.mjs tests/customer-asset-scan-child-spiffe-sdk-verifier-contract.test.mjs tests/customer-asset-scan-child-database-credential-issuer.test.mjs tests/customer-asset-scan-child-database-credential-issuer.openssl.test.mjs tests/customer-asset-scan-child-database-signer-policy.test.mjs

  local-workload-api-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Compose is available
        run: docker compose version
      - name: Run isolated SPIRE positive and negative attestation tests
        run: bash eper/tests/fixtures/spire-workload-api/run.sh
