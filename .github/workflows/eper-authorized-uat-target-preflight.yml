name: EPER Authorized UAT Target Preflight

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Service-owner-approved HTTPS UAT base URL"
        required: true
        type: string
      health_path:
        description: "Approved unauthenticated health path"
        required: true
        default: "/health"
        type: string
      expected_build_id:
        description: "Expected deployed build/commit identifier"
        required: true
        type: string
      build_id_json_field:
        description: "JSON field in the health response containing the build identifier"
        required: true
        default: "buildId"
        type: string

permissions:
  contents: read

jobs:
  target-preflight:
    name: Validate approved target and deployed build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: eper-business-uat
    env:
      UAT_ALLOWED_HOST: ${{ vars.UAT_ALLOWED_HOST }}
      UAT_BASE_URL: ${{ inputs.base_url }}
      UAT_HEALTH_PATH: ${{ inputs.health_path }}
      UAT_EXPECTED_BUILD_ID: ${{ inputs.expected_build_id }}
      UAT_BUILD_ID_JSON_FIELD: ${{ inputs.build_id_json_field }}
    steps:
      - name: Validate target, probe health endpoint, and verify build identity
        id: preflight
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          result = {
              "schemaVersion": 1,
              "check": "eper-authorized-uat-target-preflight",
              "timestampUtc": datetime.now(timezone.utc).isoformat(),
              "status": "FAIL",
              "checks": {},
          }

          def finish(code=1):
              path = "uat-target-health-result.json"
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(result, f, indent=2, sort_keys=True)
                  f.write("\n")
              print(json.dumps(result, indent=2, sort_keys=True))
              sys.exit(code)

          base = os.environ.get("UAT_BASE_URL", "").strip()
          allow = os.environ.get("UAT_ALLOWED_HOST", "").strip()
          health_path = os.environ.get("UAT_HEALTH_PATH", "").strip()
          expected = os.environ.get("UAT_EXPECTED_BUILD_ID", "")
          field = os.environ.get("UAT_BUILD_ID_JSON_FIELD", "").strip()

          if not allow:
              result["checks"]["allowlist"] = {"status": "FAIL", "reason": "UAT_ALLOWED_HOST environment variable is missing"}
              finish()
          try:
              parsed = urllib.parse.urlsplit(base)
              valid_base = (
                  parsed.scheme == "https"
                  and bool(parsed.hostname)
                  and not parsed.username
                  and not parsed.password
                  and not parsed.query
                  and not parsed.fragment
                  and parsed.path in ("", "/")
                  and parsed.netloc.lower() == allow.lower()
              )
          except Exception:
              valid_base = False
              parsed = None
          if not valid_base:
              result["checks"]["targetValidation"] = {
                  "status": "FAIL",
                  "reason": "Base URL must be HTTPS, contain only an approved host (and optional port), and exactly match UAT_ALLOWED_HOST; credentials, paths, queries, and fragments are prohibited.",
              }
              finish()
          result["targetHost"] = parsed.netloc
          result["checks"]["targetValidation"] = {"status": "PASS", "reason": "HTTPS host exactly matches the configured allowlist"}

          try:
              hp = urllib.parse.urlsplit(health_path)
              valid_path = (
                  health_path.startswith("/")
                  and not health_path.startswith("//")
                  and bool(hp.path)
                  and not hp.scheme
                  and not hp.netloc
                  and not hp.query
                  and not hp.fragment
                  and "\\" not in health_path
              )
          except Exception:
              valid_path = False
          if not valid_path:
              result["checks"]["healthPathValidation"] = {"status": "FAIL", "reason": "Health path must be an absolute path only, with no scheme, host, query, or fragment"}
              finish()
          result["checks"]["healthPathValidation"] = {"status": "PASS"}

          if not expected or not field:
              result["checks"]["buildInputValidation"] = {"status": "FAIL", "reason": "Expected build identifier and JSON field are required"}
              finish()
          result["checks"]["buildInputValidation"] = {"status": "PASS"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          url = urllib.parse.urlunsplit(("https", parsed.netloc, hp.path, "", ""))
          request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "EPER-UAT-Preflight/1.0"}, method="GET")
          started = time.monotonic()
          try:
              opener = urllib.request.build_opener(NoRedirect)
              with opener.open(request, timeout=15) as response:
                  status_code = response.status
                  content_type = response.headers.get("Content-Type", "")
                  body = response.read(1024 * 1024 + 1)
              result["httpStatus"] = status_code
              result["responseContentType"] = content_type.split(";")[0].strip()
              result["elapsedMs"] = int((time.monotonic() - started) * 1000)
              if status_code < 200 or status_code >= 300:
                  result["checks"]["healthResponse"] = {"status": "FAIL", "reason": "Health endpoint did not return 2xx"}
                  finish()
              if len(body) > 1024 * 1024:
                  result["checks"]["healthResponse"] = {"status": "FAIL", "reason": "Health response exceeded the 1 MiB safety limit"}
                  finish()
              payload = json.loads(body.decode("utf-8"))
              if not isinstance(payload, dict):
                  raise ValueError("Health response JSON root must be an object")
              result["checks"]["healthResponse"] = {"status": "PASS"}
              actual = payload.get(field)
              result["buildIdField"] = field
              result["expectedBuildId"] = expected
              result["actualBuildId"] = actual if isinstance(actual, str) else None
              if not isinstance(actual, str) or actual != expected:
                  result["checks"]["buildIdentity"] = {"status": "FAIL", "reason": "Health response build identifier did not exactly match expected value"}
                  finish()
              result["checks"]["buildIdentity"] = {"status": "PASS"}
              result["status"] = "PASS"
              result["evidenceBoundary"] = "Reachability and build identity only; not OAuth, roles, tenant scope, functional UAT, acceptance, release authorization, or certification."
              finish(0)
          except urllib.error.HTTPError as e:
              result["httpStatus"] = e.code
              result["checks"]["healthResponse"] = {"status": "FAIL", "reason": "Health endpoint returned an HTTP error or redirect; redirects are not followed"}
              finish()
          except Exception as e:
              # Keep response bodies and credentials out of artifacts/logs.
              result["checks"]["healthResponse"] = {"status": "FAIL", "reason": type(e).__name__ + ": request failed or response was not valid JSON"}
              finish()
          PY
      - name: Upload preflight metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eper-uat-target-preflight
          path: uat-target-health-result.json
          if-no-files-found: warn
          retention-days: 14
