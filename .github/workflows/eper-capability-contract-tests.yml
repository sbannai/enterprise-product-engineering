name: EPER Capability Contract Tests

on:
  pull_request:
    paths:
      - "eper/**"
      - ".github/workflows/eper-capability-contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eper
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build and run EPER test suite
        run: npm test
