name: EPER payment gateway contract tests
# Focused API contract and scheduler URL checks are grouped here to ensure they run on feature branches.
 
on:
  push:
    branches: ["reconcile/payment-stack-with-receipt-contract"]
  pull_request:
    paths:
      - "eper/apps/api/payments.ts"
      - "eper/apps/api/server.ts"
      - "eper/packages/payments/invoice-amount-authority.ts"
      - "eper/packages/pricing/market-price-book.ts"
      - "eper/tests/payment-gateway.test.mjs"
      - "eper/tests/invoice-amount-authority.test.mjs"
      - "eper/scripts/select-campaign-scheduler-database-url.mjs"
      - "eper/scripts/migrate-campaign-scheduler.mjs"
      - "eper/tests/campaign-scheduler-database-url.test.mjs"
      - "eper/packages/campaign-scheduler/**"
      - "eper/package.json"
      - "eper/package-lock.json"
      - "eper/tsconfig.json"
      - ".github/workflows/eper-payment-gateway-tests.yml"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eper-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  payment-gateway-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      # Run the isolated scheduler URL/fail-closed contract before the shared TypeScript build,
      # so a build failure does not hide whether this focused regression suite passes.
      - name: Test campaign scheduler database URL selection and fail-closed migration
        run: npm run test:campaign-scheduler-url
      - name: Build EPER
        run: npm run build
      - name: Test payment gateway verification, tenant isolation, and receipt access
        run: node --test tests/payment-gateway.test.mjs
      - name: Test trusted invoice amount authority
        run: node --test tests/invoice-amount-authority.test.mjs
