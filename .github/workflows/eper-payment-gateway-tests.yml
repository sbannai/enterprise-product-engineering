name: EPER payment gateway contract tests
# Keep focused gateway and invoice-authority contracts running on every payment/receipt branch that relies on them.


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "fix/payment-production-persistence-guard"
      - "feat/generic-transaction-receipt-contract"
      - "reconcile/payment-153-168-integration"
      - "reconcile/payment-stack-with-receipt-contract"
  pull_request:
    paths:
      - "eper/apps/api/payments.ts"
      - "eper/apps/api/server.ts"
      - "eper/packages/payments/invoice-amount-authority.ts"
      - "eper/packages/pricing/market-price-book.ts"
      - "eper/tests/payment-gateway.test.mjs"
      - "eper/tests/invoice-amount-authority.test.mjs"
      - "eper/package.json"
      - "eper/package-lock.json"
      - "eper/tsconfig.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-gateway-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Initialize diagnostic evidence
        if: always()
        run: mkdir -p reexec-evidence/ci-logs
      - name: Install locked dependencies
        run: npm ci
      - name: Build EPER
        run: npm run build
      - name: Test payment gateway verification, tenant isolation, and receipt access
        run: |
          set -o pipefail
          node --test tests/payment-gateway.test.mjs 2>&1 | tee reexec-evidence/ci-logs/payment-gateway.log
      - name: Test trusted invoice amount authority
        run: |
          set -o pipefail
          node --test tests/invoice-amount-authority.test.mjs 2>&1 | tee reexec-evidence/ci-logs/invoice-amount-authority.log

      - name: Upload payment diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EPER-PAYMENT-GATEWAY-DIAGNOSTICS-${{ github.run_id }}
          path: eper/reexec-evidence/ci-logs/
          if-no-files-found: warn
          retention-days: 14
