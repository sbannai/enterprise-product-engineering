name: G9 Reconciliation CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "eper/**"
      - ".github/workflows/g9-reconciliation.yml"
  push:
    branches: ["main"]
    paths:
      - "eper/**"
      - ".github/workflows/g9-reconciliation.yml"
  workflow_dispatch:

jobs:
  g9-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: eper
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: G9 reconciliation test
        run: node --test tests/g9-reconciliation-gate.test.mjs
