services:
  postgres:
    image: postgres:16
    container_name: eper-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eper_local_only_password}
      POSTGRES_DB: ${POSTGRES_DB:-eper_test_local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eper-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eper} -d ${POSTGRES_DB:-eper_test_local}"]
      interval: 5s
      timeout: 5s
      retries: 20

  application-data-executor:
    profiles: ["application-data"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/worker/application-data-executor-main.js"]
    restart: unless-stopped
    environment:
      EPER_APPLICATION_DATA_EXECUTOR_WORKER_ENABLED: "true"
      EPER_APPLICATION_DATA_EXECUTOR_DATABASE_URL: ${EPER_APPLICATION_DATA_EXECUTOR_DATABASE_URL:-}
      EPER_APPLICATION_DATA_EXECUTOR_EXPECTED_DATABASE_ROLE: ${EPER_APPLICATION_DATA_EXECUTOR_EXPECTED_DATABASE_ROLE:-}
      EPER_APPLICATION_DATA_EXECUTOR_WORKER_ID: ${EPER_APPLICATION_DATA_EXECUTOR_WORKER_ID:-eper-local-executor-01}
      EPER_APPLICATION_DATA_ACTIVITY_MODULE: "./dist/apps/worker/application-data-activities/postgres.js"
    depends_on:
      postgres:
        condition: service_healthy

  application-data-reconciliation:
    profiles: ["application-data"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/apps/worker/application-data-reconciliation-main.js"]
    restart: unless-stopped
    environment:
      EPER_APPLICATION_DATA_RECONCILIATION_WORKER_ENABLED: "true"
      EPER_AUDIT_PERSISTENCE: "postgres"
      EPER_APPLICATION_DATA_RECONCILIATION_DATABASE_URL: ${EPER_APPLICATION_DATA_RECONCILIATION_DATABASE_URL:-}
      EPER_APPLICATION_DATA_RECONCILIATION_EXPECTED_DATABASE_ROLE: ${EPER_APPLICATION_DATA_RECONCILIATION_EXPECTED_DATABASE_ROLE:-}
      EPER_APPLICATION_DATA_RECONCILIATION_WORKER_ID: ${EPER_APPLICATION_DATA_RECONCILIATION_WORKER_ID:-eper-local-reconcile-01}
      EPER_ENVIRONMENT: "sandbox"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  eper-postgres-data:
