name: EPER CI

on:
  push:
    branches: ["eper/ops-463-500-generated-source-v1"]
  pull_request:
    branches: ["main"]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: eper/package-lock.json
      - run: npm ci
      - run: npm run typecheck
