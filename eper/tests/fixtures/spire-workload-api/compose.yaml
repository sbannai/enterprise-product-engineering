services:
  spire-server:
    image: ghcr.io/spiffe/spire-server:1.16.0@sha256:ff546f4c62dafc479a0cd79eae9a7b6df2975754d75efd31706098e0d7548837
    user: "1000:1000"
    command: ["-config", "/etc/spire/server/server.conf"]
    volumes:
      - "${SPIRE_FIXTURE_DIR:?}/server:/etc/spire/server:ro"
      - server-data:/var/lib/spire/server
      - server-private:/run/spire/server/private
    networks: [spire-isolated]
    restart: "no"

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.16.0@sha256:ab3a8ce70435374cc5d84c81eabf0278dc046ddbc0a736d59694ba9e5975b1b6
    user: "1000:1000"
    command: ["-config", "/etc/spire/agent/agent.conf"]
    volumes:
      - "${SPIRE_FIXTURE_DIR:?}/agent:/etc/spire/agent:ro"
      - agent-data:/var/lib/spire/agent
      - "${SPIRE_FIXTURE_DIR:?}/agent-public:/run/spire/agent/public"
    tmpfs:
      - /var/lib/spire/agent/.data:uid=1000,gid=1000,mode=0700
    networks: [spire-isolated]
    depends_on: [spire-server]
    restart: "no"

  node-sdk-probe:
    build:
      context: ../../../..
      dockerfile: eper/tests/fixtures/spire-workload-api/Dockerfile.node-sdk-probe
    user: "20001:20001"
    pid: "service:spire-agent"
    volumes:
      - "${SPIRE_FIXTURE_DIR:?}/agent-public:/run/spire/agent/public:ro"
    depends_on: [spire-agent]
    networks: [spire-isolated]
    restart: "no"

networks:
  spire-isolated:
    internal: true

volumes:
  server-data:
  server-private:
  agent-data:
